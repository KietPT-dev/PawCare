server:
  # Local development port for all PawCare clients. Keep this stable so the
  # provider web and iOS Simulator always talk to the same API endpoint.
  # A deployed environment supplies its public API address to each client.
  port: 8081
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${PAWCARE_DB_URL:jdbc:mysql://localhost:3306/pawcare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${PAWCARE_DB_USERNAME:root}
    password: ${PAWCARE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PAWCARE_DB_POOL_SIZE:10}
  jackson:
    default-property-inclusion: non_null
pawcare:
  auth:
    issuer: ${PAWCARE_JWT_ISSUER:pawcare-public-api}
    # Set a random Base64 value of at least 32 bytes; app refuses the example in production.
    secret: ${PAWCARE_JWT_SECRET:CHANGE_ME_GENERATE_A_RANDOM_BASE64_SECRET_AT_LEAST_32_BYTES}
    access-token-minutes: ${PAWCARE_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${PAWCARE_REFRESH_TOKEN_DAYS:30}
  ai:
    # Disabled by default. The worker token is environment-only and is never logged.
    enabled: ${PAWCARE_AI_ENABLED:false}
    worker-token: ${PAWCARE_AI_WORKER_TOKEN:}
  mail:
    # Disabled unless explicitly configured. Never place provider credentials in
    # source control; local values belong in the ignored .env.local file.
    provider: ${PAWCARE_MAIL_PROVIDER:DISABLED}
    resend-api-key: ${PAWCARE_RESEND_API_KEY:}
    from: ${PAWCARE_MAIL_FROM:}
    reply-to: ${PAWCARE_MAIL_REPLY_TO:}
    app-deep-link-base: ${PAWCARE_APP_DEEP_LINK_BASE:pawcare://auth}
  wallet:
    # SePay sends Authorization: Apikey <token> (or Bearer <token>). This
    # local fallback prevents a blank token; production must override it with
    # PAWCARE_WALLET_WEBHOOK_TOKEN and keep that value out of source control.
    webhook-token: ${PAWCARE_WALLET_WEBHOOK_TOKEN:pawcare_secret_2026}
    expiry-check-ms: ${PAWCARE_WALLET_EXPIRY_CHECK_MS:900000}
    vietqr:
      # A real business bank account is configured by environment, never in client code.
      bank-code: ${PAWCARE_VIETQR_BANK_CODE:}
      account-no: ${PAWCARE_VIETQR_ACCOUNT_NO:}
      account-name: ${PAWCARE_VIETQR_ACCOUNT_NAME:PawCare}
  booking:
    # A provider can only report SERVICE_DONE. Funds remain locked until the
    # customer confirms, or the SLA hands the case to an administrator.
    service-done-confirmation-hours: ${PAWCARE_SERVICE_DONE_CONFIRMATION_HOURS:72}
    service-done-reminder-hours-before: ${PAWCARE_SERVICE_DONE_REMINDER_HOURS_BEFORE:24}
    service-done-check-ms: ${PAWCARE_SERVICE_DONE_CHECK_MS:900000}
  geocoding:
    # Disabled by default: never derive or fabricate a location from text.
    # Set PAWCARE_GEOCODING_PROVIDER=MAPBOX and a real API key to enable.
    provider: ${PAWCARE_GEOCODING_PROVIDER:DISABLED}
    api-key: ${PAWCARE_GEOCODING_API_KEY:}
    retry-delay-ms: ${PAWCARE_GEOCODING_RETRY_MS:60000}
  media:
    # Local development adapter. Production should provide an object-storage
    # implementation of ProviderCoverStorage and keep its credentials in env.
    provider-cover-directory: ${PAWCARE_PROVIDER_COVER_DIRECTORY:./data/provider-covers}
    provider-cover-public-path: ${PAWCARE_PROVIDER_COVER_PUBLIC_PATH:/api/v1/media/provider-covers/}
    provider-cover-max-bytes: ${PAWCARE_PROVIDER_COVER_MAX_BYTES:5242880}
  bonita:
    workflow:
      # Keep false until BookingService v2 is deployed and the technical
      # PawCare workflow account has been mapped to its actors in Bonita.
      enabled: ${PAWCARE_BONITA_WORKFLOW_ENABLED:false}
      base-url: ${PAWCARE_BONITA_URL:http://127.0.0.1:62666/bonita}
      username: ${PAWCARE_BONITA_USERNAME:}
      password: ${PAWCARE_BONITA_PASSWORD:}
      process-name: ${PAWCARE_BONITA_BOOKING_PROCESS:BookingService}
      retry-delay-ms: ${PAWCARE_BONITA_WORKFLOW_RETRY_MS:15000}
    provider-approval:
      # Enable only after ProviderApproval 1.1 is deployed and its two service
      # tasks have REST connectors configured as documented in docs/.
      enabled: ${PAWCARE_BONITA_PROVIDER_APPROVAL_ENABLED:false}
      base-url: ${PAWCARE_BONITA_PROVIDER_APPROVAL_URL:http://127.0.0.1:62666/bonita}
      username: ${PAWCARE_BONITA_PROVIDER_APPROVAL_USERNAME:}
      password: ${PAWCARE_BONITA_PROVIDER_APPROVAL_PASSWORD:}
      process-name: ${PAWCARE_BONITA_PROVIDER_APPROVAL_PROCESS:ProviderApproval}
      retry-delay-ms: ${PAWCARE_BONITA_PROVIDER_APPROVAL_RETRY_MS:15000}
      # Must be configured as an environment secret in production. Empty means
      # Bonita callbacks are intentionally rejected.
      bridge-token: ${PAWCARE_BONITA_PROVIDER_APPROVAL_BRIDGE_TOKEN:}
