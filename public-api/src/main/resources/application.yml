server:
  # Local development port for all PawCare clients. Keep this stable so the
  # provider web and iOS Simulator always talk to the same API endpoint.
  # A deployed environment supplies its public API address to each client.
  port: 8081
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${PAWCARE_DB_URL:jdbc:mysql://localhost:3306/pawcare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${PAWCARE_DB_USERNAME:root}
    password: ${PAWCARE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PAWCARE_DB_POOL_SIZE:10}
  jackson:
    default-property-inclusion: non_null
pawcare:
  auth:
    issuer: ${PAWCARE_JWT_ISSUER:pawcare-public-api}
    # Set a random Base64 value of at least 32 bytes; app refuses the example in production.
    secret: ${PAWCARE_JWT_SECRET:CHANGE_ME_GENERATE_A_RANDOM_BASE64_SECRET_AT_LEAST_32_BYTES}
    access-token-minutes: ${PAWCARE_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${PAWCARE_REFRESH_TOKEN_DAYS:30}
  wallet:
    # SePay sends Authorization: Apikey <token> (or Bearer <token>). This
    # local fallback prevents a blank token; production must override it with
    # PAWCARE_WALLET_WEBHOOK_TOKEN and keep that value out of source control.
    webhook-token: ${PAWCARE_WALLET_WEBHOOK_TOKEN:pawcare_secret_2026}
    expiry-check-ms: ${PAWCARE_WALLET_EXPIRY_CHECK_MS:900000}
    vietqr:
      # A real business bank account is configured by environment, never in client code.
      bank-code: ${PAWCARE_VIETQR_BANK_CODE:}
      account-no: ${PAWCARE_VIETQR_ACCOUNT_NO:}
      account-name: ${PAWCARE_VIETQR_ACCOUNT_NAME:PawCare}
  bonita:
    workflow:
      # Keep false until BookingService v2 is deployed and the technical
      # PawCare workflow account has been mapped to its actors in Bonita.
      enabled: ${PAWCARE_BONITA_WORKFLOW_ENABLED:false}
      base-url: ${PAWCARE_BONITA_URL:http://127.0.0.1:62666/bonita}
      username: ${PAWCARE_BONITA_USERNAME:}
      password: ${PAWCARE_BONITA_PASSWORD:}
      process-name: ${PAWCARE_BONITA_BOOKING_PROCESS:BookingService}
      retry-delay-ms: ${PAWCARE_BONITA_WORKFLOW_RETRY_MS:15000}
