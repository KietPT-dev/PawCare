name: PawCare quality

on:
  push:
  pull_request:

jobs:
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -f public-api/pom.xml test -q

  provider-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: pawcare-provider-web/package-lock.json }
      - run: npm ci
        working-directory: pawcare-provider-web
      - run: npm run build
        working-directory: pawcare-provider-web

  customer-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
        working-directory: pawcare-customer-mobile
      - run: flutter analyze
        working-directory: pawcare-customer-mobile
      - run: flutter test
        working-directory: pawcare-customer-mobile
